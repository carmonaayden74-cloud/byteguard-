<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteGuard - Offline</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #050505;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(to bottom, white, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 2rem;
        }
        p {
            font-size: 1.2rem;
            color: #999;
            margin-bottom: 2rem;
        }
        .button {
            display: inline-block;
            padding: 12px 32px;
            background: #00ff88;
            color: black;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .button:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔒</div>
        <h1>Sin Conexión</h1>
        <p>ByteGuard requiere conexión a internet para funcionar. Por favor, verifica tu conexión y vuelve a intentarlo.</p>
        <a href="/" class="button">Reintentar</a>
    </div>
</body>
</html>
